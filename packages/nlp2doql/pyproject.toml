[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp2doql"
version = "0.1.0"
description = "Natural language → DOQL (.doql.less) specification generator"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "doql>=1.0.0",
    "uri2doql>=0.1.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.0", "jsonschema>=4.21"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[project.scripts]
nlp2doql = "nlp2doql.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nlp2doql = [
    "contracts/v1/*.gbnf",
    "contracts/v1/*.json",
    "contracts/v1/*.proto",
]

[tool.setuptools.exclude-package-data]
nlp2doql = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
