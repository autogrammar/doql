[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl2doql"
version = "0.1.0"
description = "DOQL control DSL — query, patch, validate and adopt manifests"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "doql>=1.0.44",
    "uri2doql>=0.1.0",
    "nlp2doql>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.2"]

[project.scripts]
dsl2doql = "dsl2doql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
