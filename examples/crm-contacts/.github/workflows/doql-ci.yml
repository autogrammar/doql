name: doql CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install doql
        run: pip install doql
      - name: Validate
        run: doql validate
      - name: Build
        run: doql build --force
      - name: Check generated Python
        run: |
          cd build/api
          python -c "
          import py_compile, os
          for r, d, fs in os.walk('.'):
              for f in fs:
                  if f.endswith('.py'):
                      py_compile.compile(os.path.join(r,f), doraise=True)
          print('All Python files compile OK')
          "

  api-test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install doql & build
        run: |
          pip install doql
          doql build --force
      - name: Install API deps
        run: |
          if [ -f build/api/requirements.txt ]; then
            pip install -r build/api/requirements.txt
          else
            echo "No generated API; skipping dependency installation"
          fi
      - name: API smoke test
        run: |
          if [ -f build/api/main.py ]; then
            cd build/api
            timeout 10 python -c "
            from main import app
            from fastapi.testclient import TestClient
            client = TestClient(app)
            r = client.get('/health')
            assert r.status_code == 200
            assert r.json()['status'] == 'ok'
            print('Health check passed')
            "
          else
            echo "No generated API; skipping smoke test"
          fi

  web-build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install doql & build
        run: |
          pip install doql
          doql build --force
      - name: Install web deps
        run: npm --prefix build/web install
        if: ${{ hashFiles('build/web/package.json') != '' }}
      - name: Build web
        run: npm --prefix build/web run build
        if: ${{ hashFiles('build/web/package.json') != '' }}
